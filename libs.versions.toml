[versions]
compileSdk = "36"
targetSdk = "36"
minSdk = "22"

agp = "9.3.0"
kotlin = "2.4.0"
licensereport = "0.9.8"
# 1.8.0+ raises minSdk to 23 (this app supports minSdk 22); see renovate.json
appcompat = "1.7.1"
kotlinx-coroutines-android = "1.11.0"
# Pinned to the last confirmed minSdk-19 release; 1.14.0+ raises minSdk (this app supports minSdk
# 22, but the exact cutover version wasn't confirmed, hence the conservative pin); see renovate.json
androidx-core = "1.13.0"
# Pinned below 2.10.0, which requires minSdk 23 (this app supports minSdk 22); see renovate.json
lifecycle-viewmodel = "2.9.4"
# Pinned below 1.14.0, which requires minSdk 23 (this app supports minSdk 22); see renovate.json
material = "1.13.0"

[libraries]
androidx-core = { group = "androidx.core", name = "core-ktx", version.ref = "androidx-core" }
androidx-lifecycle-viewmodel = { module = "androidx.lifecycle:lifecycle-viewmodel-ktx", version.ref = "lifecycle-viewmodel" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "kotlinx-coroutines-android" }
material = { module = "com.google.android.material:material", version.ref = "material" }

[bundles]
implementation-app = [
    "androidx-core",
    "androidx-lifecycle-viewmodel",
    "androidx-appcompat",
    "kotlinx-coroutines-android",
    "material"]

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
license-report = { id = "com.jaredsburrows.license", version.ref = "licensereport" }
